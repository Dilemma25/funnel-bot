[project]
name = "bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Dilemma25",email = "valtert90@mail.ru"}
]
readme = "README.md"
requires-python =  ">=3.12,<3.15"
dependencies = [
    "aiogram (>=3.24.0,<4.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "tortoise-orm[asyncpg] (>=0.25.3,<0.26.0)",
    "aerich (>=0.9.2,<0.10.0)",
    "redis (>=5.0.0,<6.0.0)",
    "arq (>=0.27.0,<0.28.0)",
    "yookassa (>=3.10.0,<4.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.aerich]
tortoise_orm = "src.core.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
